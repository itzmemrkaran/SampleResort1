
name: Deploy SampleResort1 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy SampleResort1
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SampleResort1 Website Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy SampleResort1
        id: deployment
        uses: actions/deploy-pages@v4
